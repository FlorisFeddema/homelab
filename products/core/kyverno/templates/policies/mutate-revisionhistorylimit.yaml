apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: set-revisionhistorylimit-zero
  annotations:
    policies.kyverno.io/title: Set revisionHistoryLimit to Zero
    policies.kyverno.io/category: GitOps
    policies.kyverno.io/description: Ensure all Deployments, StatefulSets, and DaemonSets have revisionHistoryLimit set to 0 to avoid retaining old ReplicaSets and Pods.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: ["deployments", "statefulsets", "daemonsets"]
  matchConditions:
    - name: not-deleting
      expression: "!has(object.metadata.deletionTimestamp) || object.metadata.deletionTimestamp == null"
    - name: not-prometheus-operator-managed
      expression: >-
        !has(object.metadata.ownerReferences) ||
        size(object.metadata.ownerReferences) == 0 ||
        !(object.metadata.ownerReferences[0].kind in ['Prometheus', 'Alertmanager', 'ThanosRuler'])
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          [JSONPatch{op: "add", path: "/spec/revisionHistoryLimit", value: 0}]
