apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: generate-vpa-for-workloads
  annotations:
    policies.kyverno.io/title: Add VPA resource for workload
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/description: >-
        This policy automatically generates a VerticalPodAutoscaler (VPA) resource for Deployments, StatefulSets, and DaemonSets to help manage and optimize resource usage.
        The VPA resource is created in the same namespace as the workload and is linked via owner references.
        Namespaces such as kube-system, kyverno, longhorn-system, kube-public, and kube-node-lease are excluded from this policy.
        Additionally, workloads labeled with 'feddema.dev/vpa-autogen: "false"' will not have a VPA generated.
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: ["deployments", "statefulsets", "daemonsets"]
  matchConditions:
    - name: allowed-namespace
      expression: >-
        !(object.metadata.namespace in
        ['kube-system', 'kyverno', 'longhorn-system', 'kube-public', 'kube-node-lease'])
    - name: not-opted-out
      expression: >-
        !has(object.metadata.labels) ||
        !('feddema.dev/vpa-autogen' in object.metadata.labels) ||
        object.metadata.labels['feddema.dev/vpa-autogen'] != 'false'
  variables:
    - name: vpa
      expression: >-
        {
          "apiVersion": dyn("autoscaling.k8s.io/v1"),
          "kind": dyn("VerticalPodAutoscaler"),
          "metadata": dyn({
            "name": dyn(object.metadata.name),
            "namespace": dyn(object.metadata.namespace),
            "labels": dyn({"generated-by": "kyverno"}),
            "ownerReferences": dyn([{
              "apiVersion": dyn(object.apiVersion),
              "kind": dyn(object.kind),
              "name": dyn(object.metadata.name),
              "uid": dyn(object.metadata.uid),
              "controller": dyn(true),
              "blockOwnerDeletion": dyn(true)
            }])
          }),
          "spec": dyn({
            "targetRef": {
              "apiVersion": object.apiVersion,
              "kind": object.kind,
              "name": object.metadata.name
            },
            "updatePolicy": {"updateMode": "Off"}
          })
        }
  generate:
    - expression: generator.Apply(object.metadata.namespace, [variables.vpa])
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/component: admission-controller
    app.kubernetes.io/instance: kyverno
    app.kubernetes.io/part-of: kyverno
  name: kyverno:generate-vpa-policy
rules:
  - apiGroups:
      - "autoscaling.k8s.io"
    resources:
      - verticalpodautoscalers
    verbs:
      - get
      - delete
      - update
      - patch
      - create
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kyverno:generate-vpa-policy-background
  labels:
    app.kubernetes.io/component: background-controller
    app.kubernetes.io/instance: kyverno
    app.kubernetes.io/part-of: kyverno
subjects:
  - kind: ServiceAccount
    name: kyverno-background-controller
    namespace: kyverno
roleRef:
  kind: ClusterRole
  name: kyverno:generate-vpa-policy
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kyverno:generate-vpa-policy-admission
  labels:
    app.kubernetes.io/component: admission-controller
    app.kubernetes.io/instance: kyverno
    app.kubernetes.io/part-of: kyverno
subjects:
  - kind: ServiceAccount
    name: kyverno-admission-controller
    namespace: kyverno
roleRef:
  kind: ClusterRole
  name: kyverno:generate-vpa-policy
  apiGroup: rbac.authorization.k8s.io
