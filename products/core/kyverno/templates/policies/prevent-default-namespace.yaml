apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: prevent-default-namespace
  annotations:
    policies.kyverno.io/title: Prevent Default Namespace
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/description: >-
      Kubernetes Namespaces are an optional feature that provide a way to segment and
      isolate cluster resources across multiple applications and users. As a best
      practice, workloads should be isolated with Namespaces. Namespaces should be required
      and the default (empty) Namespace should not be used. This policy validates that Pods
      specify a Namespace name other than `default`. Pod controllers are matched explicitly
      so the namespace check applies to their top-level metadata.
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: ["pods", "replicationcontrollers"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: ["jobs", "cronjobs"]
  validations:
    - expression: "object.metadata.namespace != 'default'"
      message: "Using 'default' namespace is not allowed for Pods or pod controllers."
