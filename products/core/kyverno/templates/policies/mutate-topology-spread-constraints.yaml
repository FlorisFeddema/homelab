apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-topology-spread-to-workloads
  annotations:
    policies.kyverno.io/title: Add Topology Spread Constraints to Workloads
    policies.kyverno.io/category: High Availability
    policies.kyverno.io/description: Ensures Deployments and StatefulSets have topology spread constraints for high availability.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: ["deployments", "statefulsets"]
  matchConditions:
    - name: not-deleting
      expression: "!has(object.metadata.deletionTimestamp) || object.metadata.deletionTimestamp == null"
    - name: no-existing-constraints
      expression: >-
        !has(object.spec.template.spec.topologySpreadConstraints) ||
        size(object.spec.template.spec.topologySpreadConstraints) == 0
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          [JSONPatch{
            op: "add",
            path: "/spec/template/spec/topologySpreadConstraints",
            value: [
              {
                "maxSkew": dyn(1),
                "topologyKey": dyn("kubernetes.io/hostname"),
                "whenUnsatisfiable": dyn("ScheduleAnyway"),
                "labelSelector": object.spec.selector
              },
              {
                "maxSkew": dyn(1),
                "topologyKey": dyn("topology.kubernetes.io/zone"),
                "whenUnsatisfiable": dyn("ScheduleAnyway"),
                "labelSelector": object.spec.selector
              }
            ]
          }]
