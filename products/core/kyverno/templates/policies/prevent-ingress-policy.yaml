apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: deny-ingress-resources
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: ["ingresses"]
  validations:
    - expression: "false"
      message: >-
        Ingress resources are not allowed in this cluster.
        Use the Kubernetes Gateway API (Gateway, HTTPRoute, TCPRoute, etc.) instead.
