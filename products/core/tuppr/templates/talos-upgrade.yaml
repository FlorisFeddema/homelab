{{- range $zone := .Values.talosUpgrade.zones }}
---
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: gerador-{{ $zone }}
spec:
  nodeSelector:
    matchLabels:
      topology.kubernetes.io/zone: {{ $zone | quote }}
  parallelism: 1
  talos:
    version: {{ $.Values.talos.image.tag }}
  policy:
    waitForVolumeDetach: true
  healthChecks:
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      expr: |-
        status.ceph.health in ['HEALTH_OK']
    - apiVersion: v1
      kind: Node
      expr: status.conditions.filter(c, c.type == "Ready").all(c, c.status == "True")
      timeout: 10m0s
{{- end }}
