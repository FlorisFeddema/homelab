apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: garage
  labels:
    {{- include "garage.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: admin
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: garage
  labels:
    {{- include "garage.labels" . | nindent 4 }}
spec:
  groups:
    - name: garage.rules
      rules:
        - alert: GarageUnavailable
          expr: absent(up{namespace="{{ .Release.Namespace }}",service="garage-admin"}) or up{namespace="{{ .Release.Namespace }}",service="garage-admin"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Garage S3 is unavailable
            description: Prometheus cannot scrape the Garage admin health and metrics service.
        - alert: GarageDataVolumeFilling
          expr: kubelet_volume_stats_used_bytes{namespace="{{ .Release.Namespace }}",persistentvolumeclaim="garage-data"} / kubelet_volume_stats_capacity_bytes{namespace="{{ .Release.Namespace }}",persistentvolumeclaim="garage-data"} > 0.8
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Garage data volume is over 80% full
            description: The coworker backup volume is approaching its 90% bucket quota.
        - alert: GarageDataVolumeCritical
          expr: kubelet_volume_stats_used_bytes{namespace="{{ .Release.Namespace }}",persistentvolumeclaim="garage-data"} / kubelet_volume_stats_capacity_bytes{namespace="{{ .Release.Namespace }}",persistentvolumeclaim="garage-data"} > 0.85
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Garage data volume is over 85% full
            description: The Garage data disk is nearing the 90% bucket quota; uploads may soon be rejected.
        - alert: GarageMetadataVolumeFilling
          expr: kubelet_volume_stats_used_bytes{namespace="{{ .Release.Namespace }}",persistentvolumeclaim="garage-metadata"} / kubelet_volume_stats_capacity_bytes{namespace="{{ .Release.Namespace }}",persistentvolumeclaim="garage-metadata"} > 0.8
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Garage metadata volume is over 80% full
            description: Garage metadata and snapshots are approaching the PVC capacity.
        - alert: GarageMetadataVolumeCritical
          expr: kubelet_volume_stats_used_bytes{namespace="{{ .Release.Namespace }}",persistentvolumeclaim="garage-metadata"} / kubelet_volume_stats_capacity_bytes{namespace="{{ .Release.Namespace }}",persistentvolumeclaim="garage-metadata"} > 0.9
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Garage metadata volume is over 90% full
            description: Garage metadata and snapshots are near exhausting the PVC.
        - alert: GarageRestartLoop
          expr: increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}",container="garage"}[15m]) > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Garage is repeatedly restarting
            description: Garage restarted more than three times in 15 minutes.
