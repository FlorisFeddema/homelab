apiVersion: batch/v1
kind: Job
metadata:
  name: garage-credentials
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-3"
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: garage-bootstrap
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: credentials
          image: "{{ .Values.kubectlImage.repository }}:{{ .Values.kubectlImage.tag }}"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              if kubectl get secret garage-credentials -n {{ .Release.Namespace }} >/dev/null 2>&1; then
                exit 0
              fi

              access_key="GK$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
              secret_key="$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')"
              rpc_secret="$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')"

              kubectl create secret generic garage-credentials \
                -n {{ .Release.Namespace }} \
                --from-literal=accessKeyId="${access_key}" \
                --from-literal=secretAccessKey="${secret_key}" \
                --from-literal=rpcSecret="${rpc_secret}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
