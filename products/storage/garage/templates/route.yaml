apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage
  labels:
    {{- include "garage.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: envoy-gateway-public
      namespace: envoy-gateway
      sectionName: web-https
  hostnames:
    - {{ .Values.s3.hostname | quote }}
  rules:
    - backendRefs:
        - name: garage
          port: 3900
