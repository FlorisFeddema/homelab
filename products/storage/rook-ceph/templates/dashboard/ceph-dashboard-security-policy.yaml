apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ceph-dashboard-route-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: rook-ceph-dashboard
  oidc:
    provider:
      issuer: https://authentik.feddema.dev/application/o/ceph/
    redirectURL: https://ceph.feddema.dev/oauth2/callback
    logoutPath: /oauth2/sign_out
    clientID: 6AJIw6vr82M8m280SM6uZ1KMp9Vg2hvJ6XCMoiXd
    clientSecret:
      name: ceph-dashboard-route-oidc-secret
    scopes: ["profile", "email", "roles"]
    disableTokenEncryption: true
    cookieNames:
      idToken: token
    forwardAccessToken: true
