{{- $rbd := index .Values "ceph-csi-drivers" "drivers" "rbd" }}
{{- if and $rbd.enabled $rbd.deployCsiAddons }}
{{- range $endpoint := list (dict "suffix" "ctrlplugin" "port" 9070) (dict "suffix" "nodeplugin-csi-addons" "port" 9071) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: csi-addons-allow-rbd-{{ $endpoint.suffix }}
  namespace: {{ $.Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ printf "%s-%s" $rbd.name $endpoint.suffix | quote }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: csi-addons
          podSelector:
            matchLabels:
              app.kubernetes.io/name: csi-addons
              app.kubernetes.io/component: controller
              app.kubernetes.io/instance: csi-addons
      ports:
        - protocol: TCP
          port: {{ $endpoint.port }}
{{- end }}
{{- end }}
