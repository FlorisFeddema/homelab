apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "donetick.fullname" . }}
  labels: {{- include "donetick.labels" . | nindent 4 }}
spec:
  parentRefs: {{- toYaml .Values.route.parentRefs | nindent 4 }}
  hostnames: {{- toYaml .Values.route.hostnames | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ include "donetick.fullname" . }}
          port: 2021
