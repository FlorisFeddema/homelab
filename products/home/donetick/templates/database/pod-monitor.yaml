apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Values.database.clusterName }}-monitor
  labels: {{- include "donetick.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.database.clusterName }}
  podMetricsEndpoints:
    - port: metrics
