apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "donetick.fullname" . }}-init-jwt-secret
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
