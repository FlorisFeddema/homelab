apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "donetick.fullname" . }}-init-jwt-secret
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "donetick.fullname" . }}-init-jwt-secret
      containers:
        - name: jwt-secret-init
          image: "{{ .Values.secretInit.image.repository }}:{{ .Values.secretInit.image.tag }}"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              kubectl get secret {{ include "donetick.fullname" . }}-jwt -n {{ .Release.Namespace }} >/dev/null 2>&1 || \
              kubectl create secret generic {{ include "donetick.fullname" . }}-jwt -n {{ .Release.Namespace }} \
                --from-literal=jwt-secret="$(head -c 32 /dev/urandom | base64 | tr -d '\n')"
