apiVersion: v1
kind: Service
metadata:
  name: {{ include "donetick.fullname" . }}
  labels: {{- include "donetick.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 2021
      targetPort: http
      protocol: TCP
  selector: {{- include "donetick.selectorLabels" . | nindent 4 }}
