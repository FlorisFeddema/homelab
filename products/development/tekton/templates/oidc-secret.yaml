{{- if and .Values.route.enabled .Values.oidc.clientSecretSealed }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ required "oidc.secretName is required when route.enabled is true" .Values.oidc.secretName | quote }}
  namespace: tekton-operator
spec:
  encryptedData:
    client-secret: {{ .Values.oidc.clientSecretSealed | quote }}
  template:
    metadata:
      name: {{ .Values.oidc.secretName | quote }}
      namespace: tekton-operator
    type: Opaque
{{- end }}
