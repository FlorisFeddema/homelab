apiVersion: operator.tekton.dev/v1alpha1
kind: TektonConfig
metadata:
  name: config
spec:
  profile: all
  targetNamespace: tekton-operator
  dashboard:
    readonly: false
    options:
      deployments:
        tekton-dashboard:
          spec:
            replicas: 2
  pipeline:
    performance:
      disable-ha: false
      replicas: 2
    options:
      deployments:
        tekton-events-controller:
          spec:
            replicas: 2
        tekton-operator-proxy-webhook:
          spec:
            replicas: 2
        tekton-pipelines-webhook:
          spec:
            replicas: 2
  trigger:
    options:
      deployments:
        tekton-triggers-controller:
          spec:
            replicas: 2
        tekton-triggers-core-interceptors:
          spec:
            replicas: 2
        tekton-triggers-webhook:
          spec:
            replicas: 2
  chain:
    disabled: true
  result:
    disabled: true
  platforms:
    kubernetes:
      pipelinesAsCode:
        enable: false
  pruner:
    resources:
    - pipelinerun
    - taskrun
    keep: 100
    schedule: "0 8 * * *"
    disabled: false