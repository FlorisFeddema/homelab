apiVersion: operator.tekton.dev/v1alpha1
kind: TektonConfig
metadata:
  name: config
spec:
  profile: all
  targetNamespace: tekton-operator
  chain:
    disabled: true
  result:
    disabled: true
  platforms:
    kubernetes:
      pipelinesAsCode:
        enable: false
  pruner:
    resources:
    - pipelinerun
    - taskrun
    keep: 100
    schedule: "0 8 * * *"
    disabled: false