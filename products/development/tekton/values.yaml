gatus-monitor:
  appName: tekton
  publicEndpoints:
    - name: tekton
  privateEndpoints:
    - name: tekton

route:
  enabled: true
  hostnames:
    - tekton.feddema.dev
  parentRefs:
    # - name: envoy-gateway-public
    #   namespace: envoy-gateway
    #   sectionName: web-https
    - name: envoy-gateway-private
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  clientID: "Hbuz3HMYWFRY9nipYRM5GbKwLyxZOjoT4l2zUaPb"
  issuer: https://authentik.feddema.dev/application/o/tekton/
  redirectURL: https://tekton.feddema.dev/oauth2/callback
  logoutPath: /oauth2/logout
  secretName: tekton-dashboard-oidc
  clientSecretSealed: ""

tekton-operator:
  fullnameOverride: tekton-operator
  installCRDs: true
  controllers: tektonconfig,tektonpipeline,tektontrigger,tektondashboard,tektonpruner
  operator:
    replicas: 2
    autoInstallComponents: false
    defaultTargetNamespace: tekton-operator
    logLevel: warn
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
  webhook:
    replicas: 2
    logLevel: warn
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        memory: 64Mi
  service:
    createServiceMonitor: true
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
