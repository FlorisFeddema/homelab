apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homelab-devcontainer-cluster-reader
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - nodes
      - persistentvolumes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - acme.cert-manager.io
      - apps.emqx.io
      - agents.x-k8s.io
      - argoproj.io
      - aquasecurity.github.io
      - autoscaling.k8s.io
      - barmancloud.cnpg.io
      - bitnami.com
      - cert-manager.io
      - ceph.rook.io
      - cilium.io
      - csi.ceph.io
      - csiaddons.openshift.io
      - deviceplugin.intel.com
      - extensions.agents.x-k8s.io
      - externaldns.k8s.io
      - feddema.dev
      - fpga.intel.com
      - gateway.envoyproxy.io
      - gateway.networking.k8s.io
      - gateway.networking.x-k8s.io
      - groupsnapshot.storage.k8s.io
      - kyverno.io
      - monitoring.coreos.com
      - nfd.k8s-sigs.io
      - objectbucket.io
      - openreports.io
      - opentelemetry.io
      - policies.kyverno.io
      - postgresql.cnpg.io
      - promoter.argoproj.io
      - replication.storage.openshift.io
      - reports.kyverno.io
      - snapshot.storage.k8s.io
      - resource.k8s.io
      - talos.dev
      - trust.cert-manager.io
      - tuppr.home-operations.com
      - velero.io
      - wgpolicyk8s.io
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - storage.k8s.io
    resources:
      - csidrivers
      - csinodes
      - storageclasses
      - volumeattachments
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-devcontainer-users-reader-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
{{- range $user := .Values.users }}
  - kind: ServiceAccount
    name: {{ $user }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-devcontainer-users-reader-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homelab-devcontainer-cluster-reader
subjects:
{{- range $user := .Values.users }}
  - kind: ServiceAccount
    name: {{ $user }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
---
{{- range $user := .Values.users }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $user }}
  namespace: {{ $.Release.Namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $user }}-token
  namespace: {{ $.Release.Namespace }}
  annotations:
    kubernetes.io/service-account.name: {{ $user }}
type: kubernetes.io/service-account-token
---
{{- end }}
