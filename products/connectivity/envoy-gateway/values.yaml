gateway-helm:
  podDisruptionBudget:
    minAvailable: 1

  deployment:
    envoyGateway:
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 128Mi
    replicas: 2

  config:
    envoyGateway:
      provider:
        type: Kubernetes
        kubernetes:
          deploy:
            type: GatewayNamespace
      logging:
        level:
          default: warn
      extensionApis:
        enableBackend: true
defaultTlsCertificate:
  domains:
    - "feddema.dev"
    - "*.feddema.dev"
    - "*.mcp.feddema.dev"

httpRedirect:
  statusCode: 301

waf:
  enabled: true
  dynamicModule:
    name: composer
    # Composer 0.11.0 uses the Envoy 1.39-dev SDK. Revalidate ABI compatibility
    # before changing either the Envoy Gateway or Composer version.
    image: ghcr.io/tetratelabs/built-on-envoy/composer:0.12.0@sha256:e98795db51df7fbd8a832fd36ea48b0903bfb7b50107f005481b8e740e784453
    volumeName: dynamic-modules
    mountPath: /etc/envoy/dynamic-modules
    libraryPath: /etc/envoy/dynamic-modules/libcomposer.so

wafPolicy:
  enabled: true
  name: coraza-waf
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway-public
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway-private
  mode: REQUEST_ONLY
  directives:
    - Include @coraza.conf
    - SecRuleEngine DetectionOnly
    - SecResponseBodyAccess Off
    - Include @crs-setup.conf
    - Include @owasp_crs/*.conf

gateways:
  public:
    addresses:
      - 84.106.137.76
    serviceAddress: 192.168.102.30
    replicas: 2
    pdb:
      minAvailable: 1
    resources:
      requests:
        cpu: 150m
        memory: 300Mi
      limits:
        memory: 600Mi

  private:
    addresses:
      - 192.168.102.31
    serviceAddress: 192.168.102.31
    replicas: 2
    pdb:
      minAvailable: 1
    resources:
      requests:
        cpu: 150m
        memory: 300Mi
      limits:
        memory: 600Mi

gateway-addons-helm:
  alloy:
    enabled: false
  loki:
    enabled: false
  tempo:
    enabled: false
  fluent-bit:
    enabled: false
  opentelemetry-collector:
    enabled: false
  grafana:
    enabled: false
  prometheus:
    enabled: false
  dashboard:
    labels:
      grafana_dashboard: '1'
