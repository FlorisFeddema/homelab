cluster:
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381

  apiServer:
    extraArgs:
      feature-gates: DRAExtendedResource=true,DRAPartitionableDevices=true,ResourceHealthStatus=true
    resources:
      requests:
        cpu: 700m
        memory: 5Gi

  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
    resources:
      requests:
        cpu: 50m
        memory: 300Mi

  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
      feature-gates: DRAExtendedResource=true,DRAPartitionableDevices=true
    resources:
      requests:
        cpu: 50m
        memory: 100Mi

machine:
  features:
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles:
        - os:reader
        - os:admin
      allowedKubernetesNamespaces:
        - kube-system
        - tuppr
