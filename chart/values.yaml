products:
  core:
    argoCd:
      deploy: true
      namespace: argocd
    argoEvents:
      deploy: true
      serverSideApply: true
    descheduler:
      deploy: true
    kyverno:
      deploy: true
      serverSideApply: true
      serverSideDiff: true
    sealedSecrets:
      deploy: true
    talosCloudControllerManager:
      deploy: true
      namespace: kube-system
    tuppr:
      deploy: true
      autoSync: false
      serverSideApply: true
    vpa:
      deploy: true
    kubernetesReplicator:
      deploy: true
  ai:
    grafanaMcpServer:
      deploy: true
  connectivity:
    adguard:
      deploy: true
    cilium:
      deploy: true
      ignoreDifferences:
      - group: apps
        kind: DaemonSet
        jqPathExpressions:
        - .spec.template.spec.containers[].volumeMounts[].readOnly? | select(. == false)
    coredns:
      deploy: true
    devices:
      deploy: true
    envoyGateway:
      deploy: true
      serverSideApply: true
    publicExternalDns:
      deploy: true
    privateExternalDns:
      deploy: true
  development:
    argoWorkflows:
      deploy: true
      serverSideApply: true
    devcontainerUsers:
      deploy: true
      namespace: homelab-devcontainer
  monitoring:
    fluentBit:
      deploy: true
    prometheus:
      deploy: true
    loki:
      deploy: true
    gatus:
      deploy: true
    grafana:
      deploy: true
    prometheusCrd:
      deploy: true
      namespace: default
      serverSideApply: true
    metricsServer:
      deploy: true
    nodeProblemDetector:
      deploy: true
  home:
    cyberchef:
      deploy: true
    dawarich:
      deploy: true
    homeAssistant:
      deploy: true
    immich:
      deploy: true
    mealie:
      deploy: true
    nextcloud:
      deploy: true
    donetick:
      deploy: true
  iot:
    emqx:
      deploy: true
      serverSideApply: true
    zigbee2mqtt:
      deploy: true
      nameOverride: zigbee2mqtt
  media:
    mediaServer: # only deploys namespace and pvc
      deploy: true
      namespace: media-server
    jellyfin:
      deploy: true
      namespace: media-server
    seerr:
      deploy: true
      namespace: media-server
    prowlarr:
      deploy: true
      namespace: media-server
    radarr:
      deploy: true
      namespace: media-server
    sabnzbd:
      deploy: true
      namespace: media-server
    sonarr:
      deploy: true
      namespace: media-server
  deviceOperators:
    genericDevicePlugin:
      deploy: true
    intelGpuResourceDriver:
      deploy: true
    nodeFeatureDiscovery:
      deploy: true
  security:
    authentik:
      deploy: true
    certManager:
      deploy: true
    trivyOperator:
      deploy: true
  storage:
    cloudnativePg:
      deploy: true
      serverSideApply: true
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jsonPointers:
            - /webhooks/0/clientConfig/caBundle
            - /webhooks/1/clientConfig/caBundle
            - /webhooks/2/clientConfig/caBundle
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jsonPointers:
            - /webhooks/0/clientConfig/caBundle
            - /webhooks/1/clientConfig/caBundle
            - /webhooks/2/clientConfig/caBundle
            - /webhooks/3/clientConfig/caBundle
    csiAddons:
      deploy: true
    harbor:
      deploy: true
      autoSync: true
    garage:
      # Enable only after the garage-data Talos volume is ready on hortek-0.
      deploy: false
      autoSync: false
    rookCeph:
      deploy: true
      autoSync: false
      serverSideApply: true
      ignoreDifferences:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jsonPointers:
            - /spec/rules/0/backendRefs/0/weight
            - /spec/rules/0/backendRefs/0/group
            - /spec/rules/0/backendRefs/0/kind
    snapshotController:
      deploy: true
    velero:
      deploy: true
